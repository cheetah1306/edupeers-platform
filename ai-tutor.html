  <style>
      /* Voice Status Pill Styles */
      .voice-status-pill {
        display: none;
        align-items: center;
        gap: 0.6rem;
        background: rgba(255, 71, 87, 0.15);
        border: 1px solid rgba(255, 71, 87, 0.3);
        padding: 5px 14px;
        border-radius: 99px;
        color: #ff4757;
        font-size: 0.7rem;
        font-weight: bold;
        letter-spacing: 1.2px;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 15px rgba(255, 71, 87, 0.2);
        width: fit-content;
        margin: 0 auto 0.5rem 1rem;
        animation: statusSlideInUp 0.3s ease-out;
      }

      .voice-status-pill.active {
        display: flex;
      }

      .voice-wave-mini {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 10px;
      }

      .wave-bar-mini {
        width: 2px;
        height: 100%;
        background: #ff4757;
        border-radius: 1px;
        animation: waveHeightMini 0.6s ease-in-out infinite alternate;
      }

      .wave-bar-mini:nth-child(2) { animation-delay: 0.1s; }
      .wave-bar-mini:nth-child(3) { animation-delay: 0.2s; }

      @keyframes waveHeightMini {
        from { height: 4px; }
        to { height: 12px; }
      }

      @keyframes statusSlideInUp {
        from { transform: translateY(10px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      /* ── Mic Button Base ── */
      .mic-btn {
        position: relative;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--hud-cyan, #00f3ff);
        font-size: 1.3rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.3s ease, border-color 0.3s ease,
                    color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        flex-shrink: 0;
        overflow: visible;
      }

      /* Idle hover */
      .mic-btn:not(.recording):hover {
        background: rgba(0, 243, 255, 0.08);
        border-color: rgba(0, 243, 255, 0.4);
        transform: scale(1.08);
        box-shadow: 0 0 18px rgba(0, 243, 255, 0.25);
      }

      /* ── RECORDING (Unmuted) State ── */
      .mic-btn.recording {
        background: rgba(0, 243, 255, 0.12);
        border-color: #00f3ff;
        color: #00f3ff;
        box-shadow: 0 0 0 0 rgba(0, 243, 255, 0.6);
        animation: micPulseRing 1.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      /* Outer pulse ring that expands */
      .mic-btn.recording::before {
        content: '';
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 1px solid rgba(0, 243, 255, 0.5);
        animation: micRingExpand 1.4s ease-out infinite;
        pointer-events: none;
      }

      /* Second delayed ring for depth */
      .mic-btn.recording::after {
        content: '';
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        border: 1.5px solid rgba(0, 243, 255, 0.25);
        animation: micRingExpand 1.4s ease-out 0.5s infinite;
        pointer-events: none;
      }

      @keyframes micPulseRing {
        0%, 100% { box-shadow: 0 0 0 0 rgba(0, 243, 255, 0.5), 0 0 20px rgba(0, 243, 255, 0.3); }
        50%       { box-shadow: 0 0 0 8px rgba(0, 243, 255, 0), 0 0 30px rgba(0, 243, 255, 0.5); }
      }

      @keyframes micRingExpand {
        0%   { transform: scale(1);   opacity: 0.8; }
        100% { transform: scale(1.5); opacity: 0;   }
      }

      /* ── MUTED / Stopped Indicator on icon ── */
      .mic-btn:not(.recording) i.fa-microphone-slash {
        color: rgba(255, 255, 255, 0.35);
      }
  </style>

  <!-- AI Tutor Voice Typing Logic -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const micBtn   = document.getElementById('chat-mic-btn');
      const inputEl  = document.getElementById('chat-input-text');
      const voicePill = document.getElementById('voice-indicator-pill');

      // ── Browser support check ──
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        if (micBtn) {
          micBtn.style.opacity = '0.3';
          micBtn.style.cursor  = 'not-allowed';
          micBtn.title = 'Voice typing needs Chrome or Edge';
        }
        return;
      }

      // ── State ──
      let recognition  = null;
      let isListening  = false;
      let baseText     = '';
      let finalChunk   = '';

      // ── UI helpers ──
      function setActive() {
        micBtn.classList.add('recording');
        micBtn.innerHTML = '<i class="fa-solid fa-microphone-slash"></i>';
        micBtn.title = 'Click to stop';
        if (voicePill) voicePill.classList.add('active');
        isListening = true;
      }

      function setIdle() {
        micBtn.classList.remove('recording');
        micBtn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
        micBtn.title = 'Voice Type';
        if (voicePill) voicePill.classList.remove('active');
        isListening = false;
        if (recognition) { try { recognition.stop(); } catch(e){} }
      }

      // ── Build & wire recognition ──
      function buildRecognition() {
        const r = new SpeechRecognition();
        r.continuous      = true;
        r.interimResults  = true;
        r.lang            = 'en-US';
        r.maxAlternatives = 1;

        r.onstart = () => setActive();

        r.onresult = (ev) => {
          let interim = '';
          for (let i = ev.resultIndex; i < ev.results.length; i++) {
            const t = ev.results[i][0].transcript;
            if (ev.results[i].isFinal) { finalChunk += t + ' '; }
            else                        { interim     = t; }
          }
          inputEl.value = (baseText + finalChunk + interim).trimStart();
        };

        r.onerror = (ev) => {
          console.warn('[Voice] Error:', ev.error);
          if (ev.error === 'not-allowed' || ev.error === 'permission-denied') {
            setIdle();
            alert('🎤 Microphone blocked!\n\nClick the 🔒 padlock in the address bar → Microphone → Allow → then refresh the page.');
          }
          // no-speech / network → silent, onend will restart automatically
        };

        r.onend = () => {
          // Auto-restart while the user hasn't manually stopped
          if (isListening) {
            try { r.start(); } catch(e) { setIdle(); }
          }
        };

        return r;
      }

      // ── Main toggle ──
      micBtn.addEventListener('click', async (e) => {
        e.preventDefault();

        if (isListening) {
          setIdle();
          return;
        }

        // Explicitly ask for mic permission before touching SpeechRecognition
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          // Permission granted — stop the raw stream, let SpeechRecognition use the mic
          stream.getTracks().forEach(t => t.stop());
        } catch (err) {
          alert('🎤 Microphone access denied.\n\nPlease allow microphone access in your browser settings and try again.');
          return;
        }

        // Fresh recognition instance each recording session
        baseText    = inputEl.value.trim() ? inputEl.value.trim() + ' ' : '';
        finalChunk  = '';
        recognition = buildRecognition();

        try {
          recognition.start();
        } catch (err) {
          console.error('[Voice] Could not start:', err);
          setIdle();
        }
      });
    });
  </script>
